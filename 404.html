<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f8f7f4">
  <title>Drawing dead. — Anshu Wang</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f8f7f4'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Georgia,serif' font-size='48' fill='%23272d29'%3EA%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f8f7f4;
      color: #272d29;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.7;
    }
    ::selection { background: #dce4d5; }
    main {
      max-width: 704px;
      margin: 0 auto;
      padding: clamp(88px, 20vh, 176px) 32px 48px;
    }
    .error-code { margin: 0 0 18px; color: #4c614b; font-size: 14px; }
    h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-size: clamp(44px, 7vw, 64px);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 1.1;
    }
    .message { margin: 24px 0 20px; color: #656a63; font-size: 17px; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      color: #4c614b;
      font-size: 15px;
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
    }
    a:hover { color: #272d29; }
    a:focus-visible { outline: 2px solid #4c614b; outline-offset: 6px; border-radius: 2px; }
    @media (max-width: 480px) {
      main { padding-right: 24px; padding-left: 24px; }
      .message { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="error-code">404</p>
    <h1>Drawing dead.</h1>
    <p class="message">This page doesn&rsquo;t exist.</p>
    <a href="/">Back home <span aria-hidden="true">&nearr;</span></a>
  </main>
</body>
</html>
